name: verification

# Reviewer-facing one-click evidence. Five jobs, all deterministic and
# zero-API:
#   1-3. each module's frozen environment installs and imports cleanly
#        on a clean Linux runner (conda Python pinned to the module's
#        documented version);
#   4.   the LLM_consensus poetry environment installs from the lock;
#   5.   the verification suite: 54 pytest cases (including the
#        real-artifact checks) plus the four key-number checks.
#
# Claims made by this workflow are exactly what it proves: environment
# installability on ubuntu-latest and green verification runs. Nothing
# here asserts cross-platform availability (the repo documents
# development on NVIDIA-GPU Linux/Windows workstations).

on:
  push:
    branches: [main, feat/verification]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extraction-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: extraction
          create-args: python=3.12.3
      - name: Install frozen environment
        shell: micromamba run -n extraction bash {0}
        run: pip install -q -r Automated_Data_Extraction/requirements-frozen.txt
      - name: Import smoke test
        shell: micromamba run -n extraction bash {0}
        run: python -c "import pandas, numpy, fitz"  # core extraction deps

  unsupervised-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: unsupervised
          create-args: python=3.9.13
      - name: Install frozen environment
        shell: micromamba run -n unsupervised bash {0}
        run: pip install -q -r Unsupervised_Learning/requirements-frozen.txt
      - name: Import smoke test
        shell: micromamba run -n unsupervised bash {0}
        run: python -c "import sklearn, pandas, numpy"  # sklearn pinned 1.6.1

  supervised-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: supervised
          create-args: python=3.9.23
      - name: Install frozen environment
        shell: micromamba run -n supervised bash {0}
        run: pip install -q -r Supervised_Learning/requirements-frozen.txt
      - name: Import smoke test
        shell: micromamba run -n supervised bash {0}
        run: |
          python -c "import sklearn, pandas, numpy, joblib"
          python -c "import sklearn; assert sklearn.__version__ == '1.6.1', sklearn.__version__"

  llm-consensus-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install poetry
        run: pipx install poetry
      - name: Install locked environment
        working-directory: LLM_consensus
        run: poetry install
      - name: Import smoke test
        working-directory: LLM_consensus
        run: poetry run python -c "import pandas, scipy, sklearn; from dotenv import load_dotenv"

  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [extraction-env, unsupervised-env, supervised-env, llm-consensus-env]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install poetry
        run: pipx install poetry
      - name: Install locked environment
        working-directory: LLM_consensus
        run: poetry install
      - name: Test tooling (dev-only, same as local runs)
        working-directory: LLM_consensus
        run: poetry run pip install -q pytest pytest-cov
      - name: Verification suite (54 tests incl. real-artifact checks)
        working-directory: LLM_consensus
        run: poetry run python -m pytest ../Agent/verification -q
      - name: Key-number checks
        working-directory: LLM_consensus
        run: poetry run python ../Agent/verification/verify_key_numbers.py --check all
